<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#7b1f2a">
    <meta name="description" content="A birthday mission for Polina with wolves and English/Russian text.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Happy Birthday, Polina">
    <meta property="og:description" content="A moonlit wolf birthday page from a good friend.">
    <title>Happy Birthday, Polina</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="enhancements.css">
    <link rel="stylesheet" href="final-enhancements.css">
  </head>
  <body>
    <main class="page-shell">
      <div class="comic-backdrop" aria-hidden="true">
        <span class="snow snow-a"></span>
        <span class="snow snow-b"></span>
        <span class="moon-ring moon-ring-a"></span>
        <span class="moon-ring moon-ring-b"></span>
        <span class="ridge ridge-a"></span>
        <span class="ridge ridge-b"></span>
        <span class="floating-shape float-heart heart-one"></span>
        <span class="floating-shape float-heart heart-two"></span>
        <span class="floating-shape float-heart heart-three"></span>
        <span class="floating-shape float-gift gift-one"></span>
        <span class="floating-shape float-gift gift-two"></span>
        <span class="floating-shape float-gift gift-three"></span>
      </div>

      <section class="birthday-app" aria-live="polite">
        <header class="topbar">
          <button class="icon-button" id="musicButton" type="button" aria-label="Music placeholder">
            <span aria-hidden="true">M</span>
          </button>
          <div class="language-switch" role="group" aria-label="Language switch">
            <button class="lang-option active" type="button" data-lang="en">ENG</button>
            <button class="lang-option" type="button" data-lang="ru">RU</button>
          </div>
          <div class="progress" id="progress" aria-hidden="true"></div>
        </header>

        <div class="frame-hero-stage" aria-hidden="true">
          <span class="impact-puff puff-one">HOWL</span>
          <span class="impact-puff puff-two">MOON</span>
          <span class="stage-party stage-heart stage-heart-one"></span>
          <span class="stage-party stage-heart stage-heart-two"></span>
          <span class="stage-party stage-gift stage-gift-one"></span>
          <span class="stage-party stage-gift stage-gift-two"></span>
          <span class="wolf-run wolf-one">
            <i class="wolf-ear ear-front"></i><i class="wolf-ear ear-back"></i><i class="wolf-snout"></i><i class="wolf-tail"></i><i class="wolf-leg leg-one"></i><i class="wolf-leg leg-two"></i><i class="wolf-leg leg-three"></i><i class="wolf-leg leg-four"></i><i class="wolf-eye"></i>
          </span>
          <span class="wolf-run wolf-two">
            <i class="wolf-ear ear-front"></i><i class="wolf-ear ear-back"></i><i class="wolf-snout"></i><i class="wolf-tail"></i><i class="wolf-leg leg-one"></i><i class="wolf-leg leg-two"></i><i class="wolf-leg leg-three"></i><i class="wolf-leg leg-four"></i><i class="wolf-eye"></i>
          </span>
          <span class="wolf-run wolf-three">
            <i class="wolf-ear ear-front"></i><i class="wolf-ear ear-back"></i><i class="wolf-snout"></i><i class="wolf-tail"></i><i class="wolf-leg leg-one"></i><i class="wolf-leg leg-two"></i><i class="wolf-leg leg-three"></i><i class="wolf-leg leg-four"></i><i class="wolf-eye"></i>
          </span>
          <span class="wolf-run wolf-four">
            <i class="wolf-ear ear-front"></i><i class="wolf-ear ear-back"></i><i class="wolf-snout"></i><i class="wolf-tail"></i><i class="wolf-leg leg-one"></i><i class="wolf-leg leg-two"></i><i class="wolf-leg leg-three"></i><i class="wolf-leg leg-four"></i><i class="wolf-eye"></i>
          </span>
        </div>

        <div id="screens"></div>
      </section>

      <audio id="song" preload="auto" loop playsinline src="assets/birthday-song.mp3"></audio>

      <dialog class="photo-modal" id="photoModal" aria-label="Photo preview">
        <button class="modal-close" id="modalClose" type="button" aria-label="Close">x</button>
        <div class="modal-preview" id="modalPreview">Photo coming soon</div>
        <p id="modalCaption">Add your image later in the assets folder.</p>
      </dialog>

      <dialog class="gallery-modal" id="galleryModal" aria-label="Gallery">
        <div class="gallery-head">
          <p id="galleryTitle">Polina gallery</p>
          <button class="modal-close inline-close" id="galleryClose" type="button" aria-label="Close">x</button>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
      </dialog>

      <dialog class="secret-modal" id="secretModal" aria-label="Secret birthday message">
        <button class="modal-close" id="secretClose" type="button" aria-label="Close">x</button>
        <div class="secret-card">
          <span class="secret-badge" aria-hidden="true">*</span>
          <p class="eyebrow" id="secretEyebrow">Hidden panel</p>
          <h2 id="secretTitle">A little extra light</h2>
          <p id="secretCopy">Even from far away, this little birthday mission was made with real care. Happy Birthday, Polina.</p>
        </div>
      </dialog>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <script src="script.js"></script>
    <script src="ending-enhancements.js"></script>
  </body>
</html>
